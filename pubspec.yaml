name: cartkaro_partner_hub
description: "CartKaro Partner Hub"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5


dependencies:

  flutter:
    sdk: flutter


  # ======================
  # ICONS
  # ======================

  cupertino_icons: ^1.0.8
  # ======================
  # STATE MANAGEMENT
  # ======================

  provider: ^6.1.5+1



  # ======================
  # RESPONSIVE UI
  # ======================

  flutter_screenutil: ^5.9.3



  # ======================
  # UI DESIGN
  # ======================

  google_fonts: ^8.1.0



  # ======================
  # ROUTING
  # ======================

  go_router: ^17.3.0



  # ======================
  # LOCATION & MAP
  # ======================

  geolocator: ^10.1.0
  geocoding: ^2.1.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1



  # ======================
  # IMAGE / DOCUMENT UPLOAD
  # ======================

  image_picker: ^1.2.2
  file_picker: ^11.0.2



  # ======================
  # FIREBASE (Active)
  # ======================

  firebase_core: ^4.10.0
  firebase_auth: ^6.5.4

  # ======================
  # FIREBASE (Future — uncomment when implementing Firestore, Storage, Notifications)
  # ======================
  # firebase_messaging: ^16.3.0
  cloud_firestore: ^6.6.0
  # firebase_storage: ^13.4.3
  # flutter_local_notifications: ^22.0.1



  # ======================
  # PAYMENT (Future — uncomment when implementing Razorpay)
  # ======================
  # razorpay_flutter: ^1.4.5



  # ======================
  # DASHBOARD CHART
  # ======================

  fl_chart: ^0.65.0



  # ======================
  # INTERNET CHECK
  # ======================

  connectivity_plus: ^7.1.1



  # ======================
  # CALL / URL LAUNCH
  # ======================

  url_launcher: ^6.3.2



  # ======================
  # UTILITIES
  # ======================

  intl: ^0.20.2



  # ======================
  # SECURITY / LOCAL AUTH
  # ======================

  shared_preferences: ^2.3.0   # Store PIN hash locally on device
  local_auth: ^2.3.0           # Face ID (iOS) / Fingerprint (Android)
  crypto: ^3.0.3               # SHA-256 PIN hashing
  http: ^1.6.0
  lucide_icons_flutter: ^3.1.19



dev_dependencies:

  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0



flutter:

  uses-material-design: true


  assets:
    - assets/logo.png
    - assets/categories/